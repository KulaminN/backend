<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Frontend v1.0</title>
</head>
<body>
<h1>Frontend v1.0</h1>
<input id="text" placeholder="Введите текст">
<button onclick="send()">Отправить</button>
<p id="out"></p>

<script>
    async function send() {
        const text = document.getElementById("text").value;
        const r = await fetch("http://localhost:8081/submit", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({text: text})
        });
        const data = await r.json();
        document.getElementById("out").innerText = data.message;
    }
</script>
</body>
</html>
